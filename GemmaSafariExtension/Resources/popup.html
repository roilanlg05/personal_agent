<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma Extension</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-width: 280px;
      max-width: 340px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-weight: 500;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: var(--text-muted);
    }
    .val {
      font-weight: 500;
      color: var(--text);
    }
    .val.ok { color: var(--success); }
    .val.err { color: var(--danger); }
    .val.warn { color: var(--warning); }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-warning {
      background: var(--warning);
      color: #0f172a;
      margin-bottom: 8px;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      min-height: 18px;
    }
    .status-msg.ok { color: var(--success); }
    .status-msg.err { color: var(--danger); }
    .status-msg.warn { color: var(--warning); }
    .cookie-debug {
      font-size: 10px;
      color: var(--text-muted);
      word-break: break-all;
      margin-top: 8px;
      max-height: 60px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Gemma Extension</h2>
    <span class="badge">A to Z</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Estado de sesión:</span>
      <span id="sessionStatus" class="val">Buscando cookies...</span>
    </div>
    <div class="row">
      <span class="label">Cookies:</span>
      <span id="cookiesCount" class="val">--</span>
    </div>
    <div class="row">
      <span class="label">Empleado ID:</span>
      <span id="employeeId" class="val">--</span>
    </div>
    <div class="row">
      <span class="label">Expira en:</span>
      <span id="tokenExpiry" class="val">--</span>
    </div>
  </div>

  <button id="grantPermBtn" class="btn-warning" style="display: none;">
    <span>Permitir acceso en Safari</span>
  </button>

  <button id="syncBtn" class="btn-primary" disabled>
    <span>Sincronizar con Gemma</span>
  </button>

  <button id="refreshBtn" class="btn-secondary">
    <span>Volver a verificar</span>
  </button>

  <button id="openAtoZBtn" class="btn-secondary" style="display: none;">
    <span>Abrir Amazon A to Z</span>
  </button>

  <button id="returnBtn" class="btn-primary" style="display: none;">Volver a Gemma</button>

  <div id="statusMsg" class="status-msg"></div>
  <div id="cookieDebug" class="cookie-debug"></div>

  <script src="popup.js"></script>
</body>
</html>
